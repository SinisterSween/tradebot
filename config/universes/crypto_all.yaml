asset_class: crypto
exchange: binanceus
timezone: UTC

backfill:
  days: 180
  timeframe: "1m"
  limit_per_call: 1000
tick_size: 0.01
point_value: 1
trade_min_qty: 0.0001

risk:
  flat_time: "23:59"
  max_notional_pct: 0.10
  min_notional_usd: 10
  max_daily_loss_R: 999
  max_consec_losses: 999

execution:
  cooldown_bars: 0
  be_lock_min: 999999
  be_req_profit_ticks: 999999

# default strategy (for ETH/SOL)
strategy:
  name: vwap_reversion
  atr_len: 14
  atr_mult: 1.0
  target_R: 1.0
  stop_pad_ticks: 2
  target_vwap: true
  session_windows:
    - start: "00:00"
      end: "23:59"

symbols:
  - symbol: ETH/USDT
    strategy:
      name: TrendPullback
      atr_len: 14
      atr_mult: 1.2
      target_R: 0.6
      slope_min: 0.08
      pullback_atr: 0.15
      vwap_entry_min_atr: 0.5
      vwap_entry_max_atr: 5.0
      min_vwap_target_R: 0.2
      stop_pad_ticks: 3
      min_atr_pct: 0.0002
      max_bar_range_atr: 4.0
    execution:
      cooldown_bars: 5
      max_hold_min: 45

  - symbol: SOL/USDT
  # Locked do not change unless market changes
    strategy:
      name: VwapReversion
      atr_len: 14
      atr_mult: 1.3
      target_R: 1.0
      slope_max: 0.08
      stop_pad_ticks: 1 #When going live flip to 2 then after a few weeks can drop to 1
      orb_minutes: 10
      target_vwap: false
      min_atr_pct: 0.001
      max_bar_range_atr: 6.0
      vwap_entry_min_atr: 0.5
      vwap_entry_max_atr: 3.5
      ema_slope_max: 0.0
      ema_max_dist_atr: 0.0
      min_vwap_target_R: 0.25
    execution:
      cooldown_bars: 5
      max_hold_min: 30

    risk:
      flat_time: "23:59"
      max_notional_pct: 0.10
      min_notional_usd: 10

  - symbol: XRP/USDT
    # XRP RSI MR — baseline locked (validated IS + OOS)
    # Do not modify without version bump
    tick_size: 0.0001
    point_value: 1
    trade_min_qty: 1.0
    rotate: true
    strategy:
      name: rsi_mean_reversion
      fallback: null
      allow_shorts: false
      allow_longs: true
      target_vwap: false
      rsi_len: 14
      rsi_buy_below: 28
      rsi_sell_above: 72
      atr_len: 14
      atr_mult: 1.0
      target_R: 0.25
      stop_pad_ticks: 15
      require_cross: false
      min_minutes_between_trades: 0
      max_trades_per_day: 0
      min_atr_pct: 0.00005
      slope_max: 0.02
      ema_slope_atr_min: -999
      ema_slope_max: 0.0
      ema_dist_atr_min: 14
      ema_dist_atr_max: 999
      exit_on_ema: true
      exit_ema_len: 20
      exit_ema_side: touch
      vwap_entry_max_atr: 999
      vwap_dist_atr_min: 12
      min_vwap_target_R: 0.0
      use_early_range_target: true
      early_range_mult: 1.0
      early_min_range_atr: 0.05     # optional; require early move big enough
      require_early_done: false     # don’t trade before early window completes
      use_session_open_stop: true
      session_open_stop_atr_pad: 0.15
    execution:
      be_lock_min: 14
      be_req_profit_ticks: 1
      max_hold_min: 45
      min_minutes_to_window_end: 10
    risk:
      min_notional_usd: 1

  - symbol: LTC/USDT
    #Locked and approved RSI MR config
    # LTC RSI MR — validated with BE=14
    # Same BE logic as XRP, generalization confirmed
    tick_size: 0.01
    point_value: 1
    trade_min_qty: 0.01
    rotate: true
    strategy:
      name: rsi_mean_reversion
      allow_longs: true
      allow_shorts: false
      rsi_len: 14
      rsi_buy_below: 28
      rsi_sell_above: 72
      atr_len: 14
      atr_mult: 1.0
      target_R: 0.25
      stop_pad_ticks: 15
      exit_on_ema: true
      exit_ema_len: 20
      exit_ema_side: touch
      min_atr_pct: 0.00005
    execution:
      be_lock_min: 14        # 👈 reuse XRP baseline
      be_req_profit_ticks: 1
      max_hold_min: 45

