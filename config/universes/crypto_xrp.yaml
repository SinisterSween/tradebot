symbols:
  - XRP/USDT
asset_class: crypto
exchange: binanceus
timezone: UTC

backfill:
  days: 180
  timeframe: "1m"
  limit_per_call: 1000

tick_size: 0.0001
point_value: 1
trade_min_qty: 1.0

risk:
  flat_time: "23:59"
  max_notional_pct: 0.10
  min_notional_usd: 1
  max_daily_loss_R: 999
  max_consec_losses: 999

execution:
  be_lock_min: 999999
  be_req_profit_ticks: 999999
  max_hold_min: 45
  min_minutes_to_window_end: 10

strategy_name: rsi_mean_reversion
strategy:
  fallback: null
  allow_shorts: false
  allow_longs: true
  target_vwap: false
  rsi_len: 14
  rsi_buy_below: 28
  rsi_sell_above: 72
  atr_len: 14
  atr_mult: 0.8
  target_R: 0.25
  stop_pad_ticks: 15
  require_cross: false
  min_minutes_between_trades: 0
  max_trades_per_day: 0
  min_atr_pct: 0.00005
  slope_max: 0.02
  ema_slope_atr_min: -999
  ema_slope_max: 0.0
  ema_dist_atr_min: 8.0
  ema_dist_atr_max: 999
  exit_on_ema: true
  exit_ema_len: 20
  exit_ema_side: touch
  vwap_entry_max_atr: 999
  vwap_dist_atr_min: 12
  min_vwap_target_R: 0.0
  use_early_range_target: true
  early_range_mult: 1.0
  early_min_range_atr: 0.05
  require_early_done: false
  use_session_open_stop: true
  session_open_stop_atr_pad: 0.15
  session_windows:
    - start: "00:00"
      end: "23:59"
