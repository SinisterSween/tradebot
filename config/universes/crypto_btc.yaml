symbols:
  - BTC/USDT
asset_class: crypto
exchange: binanceus
timezone: UTC

backfill:
  days: 180
  timeframe: "1m"
  limit_per_call: 1000

tick_size: 0.01
point_value: 1
trade_min_qty: 0.00001

risk:
  flat_time: "23:59"
  max_notional_pct: 0.10
  min_notional_usd: 10
  max_daily_loss_R: 999
  max_consec_losses: 999

execution:
  cooldown_bars: 5
  max_hold_min: 30
  be_lock_min: 999999
  be_req_profit_ticks: 999999

strategy_name: vwap_reversion
strategy:
  atr_len: 14
  atr_mult: 0.8
  target_R: 0.8
  target_vwap: true
  vwap_entry_min_atr: 1.0
  vwap_entry_max_atr: 0.0
  slope_max: 0.03
  ema_slope_max: 0.03
  ema_max_dist_atr: 3.0
  stop_pad_ticks: 1
  min_atr_pct: 0.003
  max_bar_range_atr: 4.0
  session_windows:
    - start: "00:00"
      end: "23:59"
