asset_class: crypto
exchange: binanceus
timezone: UTC

symbols:
  - XRP/USDT

tick_size: 0.0001
point_value: 1
trade_min_qty: 1.0   # 1 XRP

rotate: true

backfill:
  days: 180
  timeframe: "1m"
  limit_per_call: 1000

risk:
  flat_time: "23:59"
  max_notional_pct: 0.10
  min_notional_usd: 10
  max_daily_loss_R: 999
  max_consec_losses: 999

strategy:
  name: rsi_mean_reversion
  rsi_len: 14
  rsi_buy_below: 25
  rsi_sell_above: 75
  atr_len: 14
  atr_mult: 1.0
  target_vwap: true
  target_R: 1.0
  stop_pad_ticks: 2

  require_cross: true
  min_minutes_between_trades: 240
  max_trades_per_day: 0

  min_atr_pct: 0.0003
  slope_max: 0.0

  ema_slope_max: 0.0
  ema_dist_atr_min: 0.0
  ema_dist_atr_max: 0.0

  session_windows:
    - start: "00:00"
      end: "23:59"

execution:
  cooldown_bars: 0
