symbols:
  - ETH/USDT
asset_class: crypto
exchange: binanceus
timezone: UTC

backfill:
  days: 180
  timeframe: "1m"
  limit_per_call: 1000

tick_size: 0.01
point_value: 1
trade_min_qty: 0.0001

risk:
  flat_time: "23:59"
  max_notional_pct: 0.10
  min_notional_usd: 10
  max_daily_loss_R: 999
  max_consec_losses: 999

execution:
  cooldown_bars: 10
  max_hold_min: 60
  be_lock_min: 999999
  be_req_profit_ticks: 999999

strategy_name: trend_pullback
strategy:
  atr_len: 14
  atr_mult: 0.8
  target_R: 1.5
  slope_min: 0.1
  pullback_atr: 0.5
  stop_pad_ticks: 2
  min_atr_pct: 0.003
  max_bar_range_atr: 5.0
  regime_skip_bear: true
  session_windows:
    - start: "00:00"
      end: "23:59"
