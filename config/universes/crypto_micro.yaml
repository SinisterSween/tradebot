asset_class: crypto
exchange: binanceus
timezone: UTC
risk:
  flat_time: "23:59"
  max_notional_pct: 0.10
  max_daily_loss_R: 999
  max_consec_losses: 999
symbols:
  - ETH/USDT
  - SOL/USDT

tick_size: 0.01
point_value: 1
trade_min_qty: 0.001   # 0.001 BTC ~ $30

rotate: true

backfill:
  days: 180
  timeframe: "1m"
  limit_per_call: 1000

strategy:
  name: TrendPullback
  atr_len: 14
  atr_mult: 1.0
  target_R: 1.0
  slope_max: 0.03
  stop_pad_ticks: 2
  target_vwap: true
  min_atr_pct: 0.0006
  max_bar_range_atr: 2.0
  session_windows:
    - start: "00:00"
      end: "23:59"



# NEW: per-symbol overrides
symbol_overrides:
  ETH/USDT:
    strategy:
      name: TrendPullback
      atr_len: 14
      atr_mult: 1.0
      target_R: 0.8
      slope_min: 0.15
      pullback_atr: 0.25
      stop_pad_ticks: 2
      orb_minutes: 10
      min_atr_pct: 0.0002
      max_bar_range_atr: 4.0
    execution:
      cooldown_bars: 5
      be_lock_min: 15
      be_req_profit_ticks: 1
      max_hold_min: 60
      min_minutes_to_window_end: 10
    risk:
      flat_time: "23:59"
      max_notional_pct: 0.10
      min_notional_usd: 10
  SOL/USDT:
    strategy:
      name: VwapReversion
      atr_len: 14
      atr_mult: 2.6
      target_R: 1.0
      slope_max: 0.01
      stop_pad_ticks: 2
      target_vwap: true
      orb_minutes: 10
      min_atr_pct: 0.0010
      max_bar_range_atr: 2.0

      # EMA filter knobs (ONLY if your VwapReversion reads these names)
      ema_slope_max: 0.00015
      ema_max_dev_atr_max: 2.5      # rename to make it clearly a threshold
      ema_dist_atr_min: 0.8         # threshold to require meaningful stretch
      ema_fast_len: 50
      ema_slope_lookback: 5

    execution:
      cooldown_bars: 5
      be_lock_min: 15
      be_req_profit_ticks: 1

    risk:
      flat_time: "23:59"
      max_notional_pct: 0.10
      min_notional_usd: 10

  
