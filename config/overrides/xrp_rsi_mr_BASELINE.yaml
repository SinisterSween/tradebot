strategy:
  name: rsi_mean_reversion
  fallback: null
  allow_shorts: false
  allow_longs: true
  target_vwap: false

  rsi_len: 14
  rsi_buy_below: 28
  rsi_sell_above: 72

  atr_len: 14
  atr_mult: 1.0
  target_R: 0.3
  stop_pad_ticks: 20

  require_cross: false
  min_minutes_between_trades: 0
  max_trades_per_day: 0

  min_atr_pct: 0.00005
  slope_max: 0.02

  ema_slope_atr_min: -0.2
  ema_slope_max: 0.0
  ema_dist_atr_min: 6.0
  ema_dist_atr_max: 999

  exit_on_ema: true
  exit_ema_len: 20
  exit_ema_side: cross

  vwap_entry_min_atr: 0.0
  vwap_entry_max_atr: 999
  min_vwap_target_R: 0.0

  use_early_range_target: true
  early_range_mult: 1.0
  early_min_range_atr: 0.05
  require_early_done: false

  use_session_open_stop: true
  session_open_stop_atr_pad: 0.25

risk:
  min_notional_usd: 1


